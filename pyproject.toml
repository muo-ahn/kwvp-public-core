[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kwvp-core"
version = "0.1.0"
description = "Deterministic synthetic knowledge pipeline"
requires-python = ">=3.9"

[project.scripts]
kwvp-core = "kwvp_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
